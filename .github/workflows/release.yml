name: Release package

on:
  push:
    tags:
      - "kie-v*"
      - "toapis-v*"
      - "google-v*"
      - "openrouter-v*"
      - "image-kit-v*"
      - "chat-kit-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (tags can move); the comment names the release.
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1

      # No `version:` input: the action reads the exact pnpm version from package.json `packageManager`.
      # v6.1.0 is the first release that supports pnpm 12 (the `v6` major tag predates it).
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Resolve package from tag
        id: package
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            kie-v*)
              echo "name=@hk01/pi-ai-extra-kie" >> "$GITHUB_OUTPUT"
              echo "directory=packages/kie" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#kie-v}" >> "$GITHUB_OUTPUT"
              ;;
            toapis-v*)
              echo "name=@hk01/pi-ai-extra-toapis" >> "$GITHUB_OUTPUT"
              echo "directory=packages/toapis" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#toapis-v}" >> "$GITHUB_OUTPUT"
              ;;
            google-v*)
              echo "name=@hk01/pi-ai-extra-google" >> "$GITHUB_OUTPUT"
              echo "directory=packages/google" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#google-v}" >> "$GITHUB_OUTPUT"
              ;;
            openrouter-v*)
              echo "name=@hk01/pi-ai-extra-openrouter" >> "$GITHUB_OUTPUT"
              echo "directory=packages/openrouter" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#openrouter-v}" >> "$GITHUB_OUTPUT"
              ;;
            image-kit-v*)
              echo "name=@hk01/pi-ai-extra-image-kit" >> "$GITHUB_OUTPUT"
              echo "directory=packages/image-kit" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#image-kit-v}" >> "$GITHUB_OUTPUT"
              ;;
            chat-kit-v*)
              echo "name=@hk01/pi-ai-extra-chat-kit" >> "$GITHUB_OUTPUT"
              echo "directory=packages/chat-kit" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#chat-kit-v}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Verify manifest version
        env:
          PACKAGE_DIRECTORY: ${{ steps.package.outputs.directory }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          node --input-type=module -e 'import { readFile } from "node:fs/promises"; const manifest = JSON.parse(await readFile(`${process.env.PACKAGE_DIRECTORY}/package.json`, "utf8")); if (manifest.version !== process.env.RELEASE_VERSION) { throw new Error(`Tag version ${process.env.RELEASE_VERSION} does not match ${manifest.name}@${manifest.version}`); }'

      # Build before test: the image and chat kits' tests load the provider packages' built entries.
      - name: Check, build and test release package
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: |
          pnpm --filter "$PACKAGE_NAME"... run check
          pnpm --filter "$PACKAGE_NAME"... run build
          pnpm --filter "$PACKAGE_NAME"... run test

      # With --filter, pnpm resolves --pack-destination from the workspace root (verified with pnpm 12).
      - name: Pack release artifact
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: |
          mkdir -p release-artifacts
          pnpm --filter "$PACKAGE_NAME" pack --pack-destination ./release-artifacts
          ls -l release-artifacts
          # The kits' provider peers are not on a registry: pack them for the smoke test only (not released).
          if [ "$PACKAGE_NAME" = "@hk01/pi-ai-extra-image-kit" ] || [ "$PACKAGE_NAME" = "@hk01/pi-ai-extra-chat-kit" ]; then
            mkdir -p smoke-peers
            for peer in google kie toapis openrouter; do
              pnpm --filter "@hk01/pi-ai-extra-$peer" pack --pack-destination ./smoke-peers
            done
            ls -l smoke-peers
          fi

      # Installs the packed artifact exactly as a consumer would, then loads it from CommonJS and ESM
      # (the chat kit, like pi-ai, is ESM-only).
      - name: Smoke-test packed artifact
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: |
          tarball="$(ls "$PWD"/release-artifacts/*.tgz)"
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init -y > /dev/null
          if [ "$PACKAGE_NAME" = "@hk01/pi-ai-extra-image-kit" ]; then
            npm install --no-audit --no-fund "$tarball" "$GITHUB_WORKSPACE"/smoke-peers/*.tgz react@19
            node -e 'const kit = require(process.env.PACKAGE_NAME); const server = require(`${process.env.PACKAGE_NAME}/server`); const react = require(`${process.env.PACKAGE_NAME}/react`); if (typeof kit.modelIssue !== "function" || typeof server.createImageClient !== "function" || typeof react.ImageModelSelector !== "function") throw new Error("CommonJS entries are broken");'
            node --input-type=module -e 'const name = process.env.PACKAGE_NAME; const kit = await import(name); const server = await import(`${name}/server`); const browser = await import(`${name}/browser`); const react = await import(`${name}/react`); const models = server.createImageClient({ app: "smoke", policy: { scopes: { smoke: {} } }, env: {} }).forScope("smoke").listModels(); if (typeof kit.modelIssue !== "function" || typeof browser.postImageRequest !== "function" || typeof react.ErrorPanel !== "function" || models[0]?.id !== "google:gemini-nano-banana-2.1" || models[0]?.unavailableReason !== "伺服器未設定 GEMINI_API_KEY") throw new Error("ESM entries are broken");'
          elif [ "$PACKAGE_NAME" = "@hk01/pi-ai-extra-chat-kit" ]; then
            npm install --no-audit --no-fund "$tarball" "$GITHUB_WORKSPACE"/smoke-peers/*.tgz @earendil-works/pi-ai@1.2.0
            node -e 'try { require(process.env.PACKAGE_NAME); } catch (error) { if (error.code === "ERR_PACKAGE_PATH_NOT_EXPORTED") process.exit(0); throw error; } throw new Error("the chat kit must not load from CommonJS");'
            # Registers every chat provider with an offline fetch: no live list can be read, so every
            # provider uses its installed catalogue or definitions, and an unknown model fails
            # before any turn request.
            cat > ./smoke.mjs <<'SMOKE'
          const { createChatKit } = await import(process.env.PACKAGE_NAME);
          const fetch = async () => { throw new Error("offline"); };
          const { createGoogleProvider } = await import("@hk01/pi-ai-extra-google/pi-ai");
          const { createOpenRouterProvider } = await import("@hk01/pi-ai-extra-openrouter/pi-ai");
          const { createKieProvider } = await import("@hk01/pi-ai-extra-kie/pi-ai");
          const { createToapisProvider } = await import("@hk01/pi-ai-extra-toapis/pi-ai");
          const providers = [createGoogleProvider({ apiKey: "smoke", fetch }), createOpenRouterProvider({ apiKey: "smoke", fetch }), createKieProvider({ apiKey: "smoke", fetch }), createToapisProvider({ apiKey: "smoke", fetch })];
          const chat = createChatKit({ providers, fetch });
          const lists = await chat.listModels();
          if (lists.length !== 4 || lists.some((entry) => !entry.models?.length || entry.source !== "installed" || entry.refreshError !== "offline")) throw new Error(`listModels is broken: ${JSON.stringify(lists.map(({ models, ...entry }) => ({ ...entry, models: models?.length })))}`);
          const message = await chat.completeSimple({ provider: "kie", id: "no-such-model" }, { messages: [{ role: "user", content: "hi", timestamp: 1 }] });
          if (message.stopReason !== "error" || message.chatKit.error?.code !== "UNKNOWN_MODEL") throw new Error(`ESM entry is broken: ${JSON.stringify(message)}`);
          SMOKE
              node ./smoke.mjs
          elif [ "$PACKAGE_NAME" = "@hk01/pi-ai-extra-openrouter" ]; then
            npm install --no-audit --no-fund "$tarball" @earendil-works/pi-ai@1.2.0
            node -e 'try { require(`${process.env.PACKAGE_NAME}/pi-ai`); } catch (error) { if (error.code === "ERR_PACKAGE_PATH_NOT_EXPORTED") process.exit(0); throw error; } throw new Error("openrouter has no CommonJS entry");'
            node --input-type=module -e 'const { createOpenRouterProvider } = await import(`${process.env.PACKAGE_NAME}/pi-ai`); const provider = createOpenRouterProvider({ apiKey: "smoke" }); if (provider.id !== "openrouter" || provider.getModels().length === 0 || typeof provider.chatKit.offers !== "function") throw new Error("ESM entry is broken");'
          else
            npm install --no-audit --no-fund "$tarball" @earendil-works/pi-ai@1.2.0
            node -e 'const entry = require(process.env.PACKAGE_NAME); if (typeof entry.isPiAiExtraError !== "function") throw new Error("CommonJS entry is broken");'
            node --input-type=module -e 'const entry = await import(process.env.PACKAGE_NAME); const piAi = await import(`${process.env.PACKAGE_NAME}/pi-ai`); if (typeof entry.isPiAiExtraError !== "function" || Object.keys(piAi).length === 0) throw new Error("ESM entries are broken");'
          fi
          node -e 'const manifest = require(`${process.env.PACKAGE_NAME}/package.json`); if (JSON.stringify(manifest.dependencies ?? {}).includes("pi-ai-extra-internal")) throw new Error("runtime dependency on the internal package");'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-artifacts/*.tgz --title "$RELEASE_TAG" --generate-notes
