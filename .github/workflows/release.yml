name: Release package

on:
  push:
    tags:
      - "kie-v*"
      - "toapis-v*"
      - "google-v*"
      - "image-kit-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (tags can move); the comment names the release.
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.1

      # No `version:` input: the action reads the exact pnpm version from package.json `packageManager`.
      # v6.1.0 is the first release that supports pnpm 12 (the `v6` major tag predates it).
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Resolve package from tag
        id: package
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            kie-v*)
              echo "name=@hk01/pi-ai-extra-kie" >> "$GITHUB_OUTPUT"
              echo "directory=packages/kie" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#kie-v}" >> "$GITHUB_OUTPUT"
              ;;
            toapis-v*)
              echo "name=@hk01/pi-ai-extra-toapis" >> "$GITHUB_OUTPUT"
              echo "directory=packages/toapis" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#toapis-v}" >> "$GITHUB_OUTPUT"
              ;;
            google-v*)
              echo "name=@hk01/pi-ai-extra-google" >> "$GITHUB_OUTPUT"
              echo "directory=packages/google" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#google-v}" >> "$GITHUB_OUTPUT"
              ;;
            image-kit-v*)
              echo "name=@hk01/pi-ai-extra-image-kit" >> "$GITHUB_OUTPUT"
              echo "directory=packages/image-kit" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#image-kit-v}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Verify manifest version
        env:
          PACKAGE_DIRECTORY: ${{ steps.package.outputs.directory }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          node --input-type=module -e 'import { readFile } from "node:fs/promises"; const manifest = JSON.parse(await readFile(`${process.env.PACKAGE_DIRECTORY}/package.json`, "utf8")); if (manifest.version !== process.env.RELEASE_VERSION) { throw new Error(`Tag version ${process.env.RELEASE_VERSION} does not match ${manifest.name}@${manifest.version}`); }'

      # Build before test: the image kit's tests load the provider packages' built entries.
      - name: Check, build and test release package
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: |
          pnpm --filter "$PACKAGE_NAME"... run check
          pnpm --filter "$PACKAGE_NAME"... run build
          pnpm --filter "$PACKAGE_NAME"... run test

      # With --filter, pnpm resolves --pack-destination from the workspace root (verified with pnpm 12).
      - name: Pack release artifact
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: |
          mkdir -p release-artifacts
          pnpm --filter "$PACKAGE_NAME" pack --pack-destination ./release-artifacts
          ls -l release-artifacts
          # The image kit's peers are not on a registry: pack them for the smoke test only (not released).
          if [ "$PACKAGE_NAME" = "@hk01/pi-ai-extra-image-kit" ]; then
            mkdir -p smoke-peers
            for peer in google kie toapis; do
              pnpm --filter "@hk01/pi-ai-extra-$peer" pack --pack-destination ./smoke-peers
            done
            ls -l smoke-peers
          fi

      # Installs the packed artifact exactly as a consumer would, then loads it from CommonJS and ESM.
      - name: Smoke-test packed artifact
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: |
          tarball="$(ls "$PWD"/release-artifacts/*.tgz)"
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init -y > /dev/null
          if [ "$PACKAGE_NAME" = "@hk01/pi-ai-extra-image-kit" ]; then
            npm install --no-audit --no-fund "$tarball" "$GITHUB_WORKSPACE"/smoke-peers/*.tgz react@19
            node -e 'const kit = require(process.env.PACKAGE_NAME); const server = require(`${process.env.PACKAGE_NAME}/server`); const react = require(`${process.env.PACKAGE_NAME}/react`); if (typeof kit.modelIssue !== "function" || typeof server.createImageClient !== "function" || typeof react.ImageModelSelector !== "function") throw new Error("CommonJS entries are broken");'
            node --input-type=module -e 'const name = process.env.PACKAGE_NAME; const kit = await import(name); const server = await import(`${name}/server`); const browser = await import(`${name}/browser`); const react = await import(`${name}/react`); const models = server.createImageClient({ app: "smoke", policy: { scopes: { smoke: {} } }, env: {} }).forScope("smoke").listModels(); if (typeof kit.modelIssue !== "function" || typeof browser.postImageRequest !== "function" || typeof react.ErrorPanel !== "function" || models[0]?.id !== "google:gemini-nano-banana-2.1" || models[0]?.unavailableReason !== "伺服器未設定 GEMINI_API_KEY") throw new Error("ESM entries are broken");'
          else
            npm install --no-audit --no-fund "$tarball" @earendil-works/pi-ai@0.87.1
            node -e 'const entry = require(process.env.PACKAGE_NAME); if (typeof entry.isPiAiExtraError !== "function") throw new Error("CommonJS entry is broken");'
            node --input-type=module -e 'const entry = await import(process.env.PACKAGE_NAME); const piAi = await import(`${process.env.PACKAGE_NAME}/pi-ai`); if (typeof entry.isPiAiExtraError !== "function" || Object.keys(piAi).length === 0) throw new Error("ESM entries are broken");'
          fi
          node -e 'const manifest = require(`${process.env.PACKAGE_NAME}/package.json`); if (JSON.stringify(manifest.dependencies ?? {}).includes("pi-ai-extra-internal")) throw new Error("runtime dependency on the internal package");'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-artifacts/*.tgz --title "$RELEASE_TAG" --generate-notes
